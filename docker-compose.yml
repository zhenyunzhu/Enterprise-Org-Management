# ============================================================================
# tilas 智能学习辅助系统 —— 一键启动编排
# ----------------------------------------------------------------------------
# 启动：  docker compose up -d --build
# 查看：  docker compose ps && docker compose logs -f tilas-backend
# 停止：  docker compose down          （保留数据卷）
# 清空：  docker compose down -v       （同时删除 MySQL 数据卷）
# ----------------------------------------------------------------------------
# 所有敏感参数均支持通过环境变量或同目录下的 .env 文件覆盖
# ============================================================================

name: tilas

services:

  # --------------------------------------------------------------------------
  # MySQL 8.0：数据卷持久化 + 首次启动自动执行初始化脚本
  # --------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: tilas-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-tilas}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      # 数据持久化，容器重建不丢数据
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时执行，用于建表与写入初始数据
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tilas-net

  # --------------------------------------------------------------------------
  # 后端服务：等待 MySQL 健康后启动
  # --------------------------------------------------------------------------
  tilas-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tilas/tilas-web-management:1.0.0
    container_name: tilas-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # ---- 数据库 ----
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-tilas}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      # ---- JWT ----
      JWT_SIGN_KEY: ${JWT_SIGN_KEY:-SVRIRUlNQVRMSUFT}
      JWT_EXPIRE: ${JWT_EXPIRE:-43200000}
      # ---- 阿里云 OSS ----
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      OSS_BUCKET: ${OSS_BUCKET:-tilas-zzy}
      OSS_REGION: ${OSS_REGION:-cn-beijing}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      # ---- 运行时 ----
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx512m -Dfile.encoding=UTF-8}"
      TZ: Asia/Shanghai
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - tilas-net

  # --------------------------------------------------------------------------
  # 【可选】Nginx：托管前端静态资源 + 反向代理后端
  # 使用前提：
  #   1. 将前端打包产物放到 ./docker/nginx/dist 目录
  #   2. 前端请求 baseURL 配置为 /api
  # 启用方式：取消下方注释后执行 docker compose up -d --build
  # --------------------------------------------------------------------------
  #  nginx:
  #    image: nginx:1.27-alpine
  #    container_name: tilas-nginx
  #    restart: always
  #    depends_on:
  #      - tilas-backend
  #    ports:
  #      - "${NGINX_PORT:-80}:80"
  #    volumes:
  #      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #      - ./docker/nginx/dist:/usr/share/nginx/html:ro
  #    networks:
  #      - tilas-net

networks:
  tilas-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local
