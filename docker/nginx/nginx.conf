# ============================================================================
# Nginx 配置模板：托管前端静态资源 + 反向代理后端接口
# ----------------------------------------------------------------------------
# 使用方式：
#   1. 将前端打包产物（dist 目录）放到 docker/nginx/dist
#   2. 前端 axios baseURL 配置为 /api
#   3. 在 docker-compose.yml 中取消 nginx 服务注释
# ============================================================================

server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    client_max_body_size 20m;

    access_log /var/log/nginx/tilas.access.log;
    error_log  /var/log/nginx/tilas.error.log;

    # ---- 前端静态资源 ----
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        # 单页应用路由回退
        try_files  $uri $uri/ /index.html;
    }

    # ---- 静态资源缓存 ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root      /usr/share/nginx/html;
        expires   7d;
        add_header Cache-Control "public";
    }

    # ---- 后端接口反向代理 ----
    # 前端请求 /api/depts  ->  后端 /depts
    location /api/ {
        proxy_pass         http://tilas-backend:8080/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
