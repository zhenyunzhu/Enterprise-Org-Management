server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tilas-web-management

  # ===== 数据库连接 =====
  # 所有敏感信息均通过环境变量注入，未设置时回退到本地开发默认值
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tilas}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ===== MyBatis =====
mybatis:
  mapper-locations: classpath*:com/itheima/mapper/*.xml
  type-aliases-package: com.itheima.pojo
  configuration:
    map-underscore-to-camel-case: true

# ===== PageHelper 分页插件 =====
pagehelper:
  helper-dialect: mysql
  # 页码小于 1 查第一页，超过总页数查最后一页
  reasonable: true

# ===== 业务自定义配置 =====
tlias:
  jwt:
    # Base64 编码的签名密钥，生产环境务必通过 JWT_SIGN_KEY 覆盖
    sign-key: ${JWT_SIGN_KEY:SVRIRUlNQVRMSUFT}
    # 令牌有效期，单位毫秒，默认 12 小时
    expire: ${JWT_EXPIRE:43200000}

# ===== 阿里云 OSS =====
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket-name: ${OSS_BUCKET:tilas-zzy}
    region: ${OSS_REGION:cn-beijing}
    # 留空时自动回退读取环境变量 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

# ===== 日志 =====
logging:
  level:
    com.itheima.mapper: debug
    org.springframework.jdbc.support.JdbcTransactionManager: debug
